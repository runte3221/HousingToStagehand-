name: Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Download & Extract Dalamud
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/stg/latest.zip" -OutFile "dalamud.zip"
        Expand-Archive -Path "dalamud.zip" -DestinationPath "$env:GITHUB_WORKSPACE/dalamud" -Force

    - name: Restore NuGet Packages
      shell: pwsh
      run: |
        dotnet restore HousingToStagehand.csproj /p:Platform="x64"
      env:
        DALAMUD_HOME: ${{ github.workspace }}/dalamud

    - name: Build Plugin
      shell: pwsh
      run: |
        $ErrorActionPreference = "Continue"
        dotnet build HousingToStagehand.csproj -c Release /p:Platform="x64" --no-restore 2>&1 | Tee-Object -FilePath "build.log"
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Build failed! Full log output:"
          Get-Content "build.log"
          exit 1
        }
      env:
        DALAMUD_HOME: ${{ github.workspace }}/dalamud

    - name: Prepare Zip Package
      shell: pwsh
      run: |
        $binDir = "bin/x64/Release"
        if (-not (Test-Path $binDir)) {
          $binDir = "bin/Release"
        }
        $staging = "staging/HousingToStagehand"
        New-Item -ItemType Directory -Force -Path $staging
        Copy-Item -Path "$binDir/*" -Destination $staging -Recurse
        Compress-Archive -Path "staging/*" -DestinationPath "latest.zip" -Force

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "HousingToStagehand Latest Release"
        body: |
          Automated release build of HousingToStagehand.
          
          ### Custom Repository URL
          ```
          https://raw.githubusercontent.com/runte3221/HousingToStagehand-/main/repo.json
          ```
        files: |
          latest.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
